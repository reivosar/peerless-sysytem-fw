name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: cargo install cargo-audit --locked
      # libp2p 0.56 records its optional mDNS dependency in Cargo.lock even
      # though peerless does not enable or compile that feature.
      - run: cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - run: bash scripts/check-public-source-security.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -j 1 -- --test-threads=1
      - run: cargo check -p peerless-browser --target wasm32-unknown-unknown
