[package]
name = "peerless-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libp2p = { version = "0.56.0", default-features = false }
peerless-protocol = { path = "../peerless-protocol" }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
libp2p = { version = "0.56.0", default-features = false, features = ["cbor", "gossipsub", "identify", "macros", "noise", "request-response", "wasm-bindgen", "webrtc-websys", "websocket-websys", "webtransport-websys", "yamux"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
