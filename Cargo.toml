[workspace]
members = [
    "crates/peerless-core",
    "crates/peerless-identity",
    "crates/peerless-network",
    "crates/peerless-node",
    "crates/peerless-cli",
    "crates/peerless-protocol",
    "crates/peerless-storage",
    "crates/peerless-compute",
    "crates/peerless-state",
    "crates/peerless-ledger",
    "crates/peerless-browser",
    "crates/peerless-anonymous-auth",
    "crates/peerless-onion-protocol",
]
resolver = "2"
exclude = ["examples/double-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1.89"
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
hkdf = "0.13.0"
futures = "0.3.31"
automerge = "0.11.0"
libp2p = { version = "0.56.0", features = ["autonat", "cbor", "dcutr", "gossipsub", "identify", "kad", "macros", "noise", "ping", "quic", "relay", "request-response", "tcp", "tokio", "yamux"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.8"
socket2 = { version = "0.5.5", features = ["all"] }
sysinfo = "0.37.2"
tempfile = "3.10.0"
thiserror = "1.0.56"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wasmtime = { version = "46.0.2", features = ["component-model"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
qrcode = { version = "0.14.1", default-features = false }
openssl = "0.10.73"
privacypass = "=0.2.0-pre.3"
rand = { version = "0.10", features = ["sys_rng"] }
wat = "1.245.1"
x25519-dalek = { version = "2.0.1", features = ["getrandom", "reusable_secrets", "static_secrets", "zeroize"] }
zeroize = "1.8.1"
